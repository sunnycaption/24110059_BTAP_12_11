# ========================================================
# CẤU HÌNH GỬI EMAIL QUA SMTP GMAIL (JAKARTA MAIL)
# ========================================================
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.ssl.protocols=TLSv1.2

# Email người gửi (Gmail của bạn) - Thay bằng email thực tế để gửi OTP thật
mail.username=your_email@gmail.com

# Mật khẩu ứng dụng 16 ký tự (Google App Password)
# Xem hướng dẫn tạo tại: https://myaccount.google.com/apppasswords
mail.password=your_16_char_app_password

# Tên hiển thị người gửi
mail.from.name=Hệ thống Xác thực Java Web - 24110059
